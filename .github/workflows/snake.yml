name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_only_space>
      - name: generate-github-contribution-grid-snake-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#cba6f7&color_dots=#181825,#313244,#89b4fa,#f5c2e7,#cba6f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#cba6f7&color_dots=#181825,#313244,#89b4fa,#f5c2e7,#cba6f7

      # Push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
