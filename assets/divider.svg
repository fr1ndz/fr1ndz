<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 30" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e2e" stop-opacity="0" />
      <stop offset="25%" stop-color="#cba6f7" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#cba6f7;#f5c2e7;#89b4fa;#94e2d5;#cba6f7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f5c2e7">
        <animate attributeName="stop-color" values="#f5c2e7;#89b4fa;#94e2d5;#cba6f7;#f5c2e7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#89b4fa" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#89b4fa;#94e2d5;#cba6f7;#f5c2e7;#89b4fa" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-paw {
      animation: pawPulse 2s ease-in-out infinite alternate;
    }
    @keyframes pawPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #f5c2e7); }
    }
  </style>

  <!-- Glowing Line -->
  <line x1="20" y1="15" x2="830" y2="15" stroke="url(#dividerGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Center Paw Icon -->
  <g transform="translate(425, 15)">
    <g class="pulse-paw">
      <!-- Main Pad -->
      <path d="M -6 2 C -8 6, -4 10, 0 10 C 4 10, 8 6, 6 2 C 4 -2, -4 -2, -6 2 Z" fill="#f5c2e7" />
      <!-- Toe Pads -->
      <circle cx="-7" cy="-4" r="2.2" fill="#cba6f7" />
      <circle cx="-2.5" cy="-7" r="2.2" fill="#cba6f7" />
      <circle cx="2.5" cy="-7" r="2.2" fill="#cba6f7" />
      <circle cx="7" cy="-4" r="2.2" fill="#cba6f7" />
    </g>
  </g>

  <!-- Side Petals -->
  <g fill="#f2cdcd" opacity="0.8">
    <circle cx="200" cy="15" r="2" />
    <circle cx="650" cy="15" r="2" />
  </g>
</svg>
