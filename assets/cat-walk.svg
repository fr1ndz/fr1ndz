<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f5c2e7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#181825" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&amp;display=swap');

    /* --- CAT 1 (Mauve Cat) Movement --- */
    .cat1-mover {
      animation: cat1Walk 14s linear infinite;
    }
    @keyframes cat1Walk {
      0% { transform: translateX(-60px); }
      49.9% { transform: translateX(860px); }
      50% { transform: translateX(860px); }
      99.9% { transform: translateX(-60px); }
      100% { transform: translateX(-60px); }
    }

    .cat1-flipper {
      animation: cat1Flip 14s step-end infinite;
    }
    @keyframes cat1Flip {
      0% { transform: scaleX(1); }
      50% { transform: scaleX(-1); }
      100% { transform: scaleX(1); }
    }

    /* --- CAT 2 (Peach Cat) Movement --- */
    .cat2-mover {
      animation: cat2Walk 18s linear 2s infinite;
    }
    @keyframes cat2Walk {
      0% { transform: translateX(880px); }
      49.9% { transform: translateX(-70px); }
      50% { transform: translateX(-70px); }
      99.9% { transform: translateX(880px); }
      100% { transform: translateX(880px); }
    }

    .cat2-flipper {
      animation: cat2Flip 18s step-end 2s infinite;
    }
    @keyframes cat2Flip {
      0% { transform: scaleX(1); }      /* Drawn facing Left -> moves right-to-left */
      50% { transform: scaleX(-1); }    /* Flipped facing Right -> moves left-to-right */
      100% { transform: scaleX(1); }
    }

    .cat2-body-bounce {
      animation: catBounce 0.35s ease-in-out infinite alternate;
    }
    @keyframes catBounce {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-2px); }
    }

    /* Snoring z Z z */
    .snore-z1 { animation: floatZ 3s ease-out infinite; }
    .snore-z2 { animation: floatZ 3s ease-out 1s infinite; }
    .snore-z3 { animation: floatZ 3s ease-out 2s infinite; }

    @keyframes floatZ {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 1; transform: translate(8px, -12px) scale(1); }
      100% { opacity: 0; transform: translate(16px, -24px) scale(1.3); }
    }

    /* Laser Toy */
    .laser-dot {
      animation: laserMove 8s ease-in-out infinite alternate;
    }
    @keyframes laserMove {
      0% { transform: translate(100px, 94px); }
      30% { transform: translate(350px, 92px); }
      60% { transform: translate(600px, 94px); }
      100% { transform: translate(780px, 92px); }
    }

    .pet-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      fill: #a6adc8;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="120" rx="14" fill="url(#boxBg)" stroke="#313244" stroke-width="1.5" />

  <!-- Ground Line (y = 96) -->
  <line x1="20" y1="96" x2="830" y2="96" stroke="url(#groundGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Floor Decor -->
  <g fill="#f5c2e7" opacity="0.5">
    <circle cx="120" cy="96" r="3" />
    <circle cx="280" cy="96" r="2.5" />
    <circle cx="480" cy="96" r="3" />
    <circle cx="680" cy="96" r="2" />
  </g>

  <!-- Status / Header -->
  <text x="30" y="28" class="pet-label">
    <tspan fill="#f5c2e7">🐾 VSCODE-PETS CLONE</tspan> • <tspan fill="#cba6f7">Catppuccin Sanctuary</tspan>
  </text>
  <text x="820" y="28" class="pet-label" text-anchor="end" fill="#a6e3a1">
    ● Active (3 Pets Online)
  </text>

  <!-- Laser Pointer Toy -->
  <circle class="laser-dot" r="4" fill="#f38ba8" filter="url(#glow)" />

  <!-- ==================== CAT 1: MOCHA MAUVE CAT (FACING RIGHT INITIALLY) ==================== -->
  <g class="cat1-mover">
    <g class="cat1-flipper">
      <g transform="translate(0, 68)">

        <!-- Tail at back (-14, 8) -->
        <g transform="translate(-14, 8)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 0 0; 18 0 0; 0 0 0" dur="1.2s" repeatCount="indefinite" />
            <path d="M 0 0 C -6 -6, -10 -14, -2 -20" stroke="#cba6f7" stroke-width="4" fill="none" stroke-linecap="round" />
          </g>
        </g>

        <!-- Legs (Feet touch y=96) -->
        <g transform="translate(-8, 16)">
          <g><animateTransform attributeName="transform" type="rotate" values="-18 0 0; 18 0 0; -18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#b4befe" stroke-width="3.5" stroke-linecap="round" /></g>
        </g>
        <g transform="translate(8, 16)">
          <g><animateTransform attributeName="transform" type="rotate" values="18 0 0; -18 0 0; 18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#b4befe" stroke-width="3.5" stroke-linecap="round" /></g>
        </g>

        <!-- Body -->
        <ellipse cx="0" cy="10" rx="16" ry="11" fill="#cba6f7" />

        <g transform="translate(-10, 16)">
          <g><animateTransform attributeName="transform" type="rotate" values="-18 0 0; 18 0 0; -18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#cba6f7" stroke-width="3.5" stroke-linecap="round" /></g>
        </g>
        <g transform="translate(10, 16)">
          <g><animateTransform attributeName="transform" type="rotate" values="18 0 0; -18 0 0; 18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#cba6f7" stroke-width="3.5" stroke-linecap="round" /></g>
        </g>

        <!-- Head on Right (x = +14) -->
        <g transform="translate(14, 2)">
          <circle cx="0" cy="0" r="10" fill="#cba6f7" />
          <polygon points="-7,-7 -3,-14 0,-7" fill="#f5c2e7" />
          <polygon points="1,-7 5,-14 8,-7" fill="#f5c2e7" />
          <polygon points="-6,-7 -3,-12 -1,-7" fill="#f38ba8" />
          <polygon points="2,-7 5,-12 7,-7" fill="#f38ba8" />
          <circle cx="3" cy="-1" r="1.5" fill="#11111b" />
          <circle cx="7" cy="-1" r="1.5" fill="#11111b" />
          <circle cx="3.5" cy="-1.5" r="0.5" fill="#ffffff" />
          <circle cx="7.5" cy="-1.5" r="0.5" fill="#ffffff" />
          <polygon points="4.5,2 5.5,2 5,3" fill="#f38ba8" />
          <path d="M -5 7 Q 0 10 5 7" stroke="#fab387" stroke-width="2" fill="none" />
          <circle cx="0" cy="9" r="2" fill="#f9e2af" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== CAT 2: PEACH MACCHIATO CAT (FACING LEFT INITIALLY) ==================== -->
  <g class="cat2-mover">
    <g class="cat2-flipper">
      <g class="cat2-body-bounce" transform="translate(0, 68)">
        
        <!-- Tail at back (Right side x = +13) -->
        <g transform="translate(13, 8)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 0 0; -18 0 0; 0 0 0" dur="1.2s" repeatCount="indefinite" />
            <path d="M 0 0 C 6 -6, 10 -14, 2 -20" stroke="#fab387" stroke-width="4" fill="none" stroke-linecap="round" />
          </g>
        </g>

        <!-- Legs (Feet touch y=96) -->
        <g transform="translate(-10, 16)"><g><animateTransform attributeName="transform" type="rotate" values="-18 0 0; 18 0 0; -18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#fab387" stroke-width="3.5" stroke-linecap="round" /></g></g>
        <g transform="translate(-4, 16)"><g><animateTransform attributeName="transform" type="rotate" values="18 0 0; -18 0 0; 18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#f9e2af" stroke-width="3.5" stroke-linecap="round" /></g></g>
        <g transform="translate(4, 16)"><g><animateTransform attributeName="transform" type="rotate" values="-18 0 0; 18 0 0; -18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#fab387" stroke-width="3.5" stroke-linecap="round" /></g></g>
        <g transform="translate(10, 16)"><g><animateTransform attributeName="transform" type="rotate" values="18 0 0; -18 0 0; 18 0 0" dur="0.4s" repeatCount="indefinite" /><line x1="0" y1="0" x2="0" y2="12" stroke="#f9e2af" stroke-width="3.5" stroke-linecap="round" /></g></g>

        <!-- Body -->
        <ellipse cx="0" cy="10" rx="15" ry="10" fill="#fab387" />
        <ellipse cx="-2" cy="12" rx="8" ry="6" fill="#fff" opacity="0.8" />

        <!-- Head on Left (x = -12, facing left) -->
        <g transform="translate(-12, 2)">
          <circle cx="0" cy="0" r="10" fill="#fab387" />
          <polygon points="-8,-7 -5,-14 -1,-7" fill="#fab387" />
          <polygon points="0,-7 3,-14 7,-7" fill="#fab387" />
          <polygon points="-7,-7 -5,-12 -2,-7" fill="#f38ba8" />
          <polygon points="1,-7 3,-12 6,-7" fill="#f38ba8" />
          <path d="M -6 -1 Q -4 -4 -2 -1" stroke="#11111b" stroke-width="1.5" fill="none" />
          <circle cx="-5" cy="-2" r="0.5" fill="#11111b" />
          <circle cx="-3" cy="-1" r="1.5" fill="#11111b" />
          <circle cx="-3.5" cy="-1.5" r="0.5" fill="#fff" />
          <circle cx="-5" cy="3" r="2" fill="#f38ba8" opacity="0.5" />
          <circle cx="4" cy="3" r="2" fill="#f38ba8" opacity="0.5" />
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== SLEEPING CAT & CUSHION (CENTER) ==================== -->
  <g transform="translate(425, 78)">
    <ellipse cx="0" cy="14" rx="32" ry="9" fill="#313244" stroke="#cba6f7" stroke-width="1.5" />
    <ellipse cx="0" cy="8" rx="18" ry="11" fill="#f5e0dc" />
    <circle cx="12" cy="6" r="9" fill="#f5e0dc" />
    <polygon points="7,0 10,-6 13,0" fill="#f2cdcd" />
    <polygon points="13,0 16,-6 18,2" fill="#f2cdcd" />
    <path d="M 10 7 Q 12 9 14 7" stroke="#585b70" stroke-width="1.2" fill="none" />
    <path d="M -16 10 Q -24 6 -14 -1" stroke="#f5e0dc" stroke-width="4.5" fill="none" stroke-linecap="round" />

    <g transform="translate(18, -6)">
      <text class="pet-label snore-z1" fill="#b4befe" font-size="10">z</text>
      <text class="pet-label snore-z2" fill="#cba6f7" font-size="12">Z</text>
      <text class="pet-label snore-z3" fill="#f5c2e7" font-size="14">z</text>
    </g>
  </g>

</svg>
