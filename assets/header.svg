<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Catppuccin Mocha Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7">
        <animate attributeName="stop-color" values="#cba6f7;#f5c2e7;#89b4fa;#94e2d5;#cba6f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f5c2e7">
        <animate attributeName="stop-color" values="#f5c2e7;#89b4fa;#94e2d5;#cba6f7;#f5c2e7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#89b4fa">
        <animate attributeName="stop-color" values="#89b4fa;#94e2d5;#cba6f7;#f5c2e7;#89b4fa" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#313244" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#181825" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f5c2e7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;family=Outfit:wght@600;800&amp;display=swap');

    .text-title {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#titleGrad);
      letter-spacing: 2px;
    }

    .text-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      fill: #a6adc8;
      letter-spacing: 1px;
    }

    .text-bar {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      fill: #cdd6f4;
    }

    .badge-ws {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: bold;
    }

    /* Animations */
    .twinkle {
      animation: pulseStar 3s ease-in-out infinite alternate;
    }
    .twinkle-delay {
      animation: pulseStar 4s ease-in-out 1.5s infinite alternate;
    }

    @keyframes pulseStar {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .float-sakura {
      animation: floatSakura 6s ease-in-out infinite alternate;
    }

    @keyframes floatSakura {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(15deg); }
    }
  </style>

  <!-- Main Background Container -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Stars Background Decor -->
  <g fill="#f5c2e7" opacity="0.6">
    <circle cx="80" cy="80" r="1.5" class="twinkle" />
    <circle cx="150" cy="180" r="2" class="twinkle-delay" />
    <circle cx="780" cy="90" r="1.5" class="twinkle-delay" />
    <circle cx="830" cy="170" r="2" class="twinkle" />
    <path d="M 220,70 Q 222,74 226,76 Q 222,78 220,82 Q 218,78 214,76 Q 218,74 220,70 Z" fill="#cba6f7" class="twinkle" />
    <path d="M 720,190 Q 722,194 726,196 Q 722,198 720,202 Q 718,198 714,196 Q 718,194 720,190 Z" fill="#89b4fa" class="twinkle-delay" />
  </g>

  <!-- Hyprland Top Status Bar (Waybar style) -->
  <rect x="12" y="12" width="876" height="34" rx="8" fill="url(#barGrad)" stroke="#313244" stroke-width="1" />
  
  <!-- Waybar Left: Workspaces -->
  <g transform="translate(24, 21)">
    <rect x="0" y="0" width="48" height="16" rx="4" fill="#cba6f7" />
    <text x="24" y="12" class="badge-ws" fill="#11111b" text-anchor="middle">1:dev</text>

    <rect x="54" y="0" width="52" height="16" rx="4" fill="#313244" />
    <text x="80" y="12" class="badge-ws" fill="#a6adc8" text-anchor="middle">2:rust</text>

    <rect x="112" y="0" width="38" height="16" rx="4" fill="#313244" />
    <text x="131" y="12" class="badge-ws" fill="#a6adc8" text-anchor="middle">3:ai</text>
  </g>

  <!-- Waybar Center: Active Window Title -->
  <g transform="translate(450, 33)">
    <text class="text-bar" text-anchor="middle" fill="#cdd6f4">
      <tspan fill="#f5c2e7">󰅍 </tspan>artem@hyprland: ~
    </text>
  </g>

  <!-- Waybar Right: Widgets -->
  <g transform="translate(680, 21)">
    <rect x="0" y="0" width="60" height="16" rx="4" fill="#313244" />
    <text x="30" y="12" class="badge-ws" fill="#a6e3a1" text-anchor="middle">󰍛 14%</text>

    <rect x="66" y="0" width="70" height="16" rx="4" fill="#313244" />
    <text x="101" y="12" class="badge-ws" fill="#89b4fa" text-anchor="middle">󰘚 6.2GB</text>

    <rect x="142" y="0" width="54" height="16" rx="4" fill="#fab387" />
    <text x="169" y="12" class="badge-ws" fill="#11111b" text-anchor="middle">󰥔 24/7</text>
  </g>

  <!-- Center Content: Title & Subtitle -->
  <g transform="translate(450, 130)" text-anchor="middle">
    <text y="-35" font-size="20" fill="#f5c2e7" class="float-sakura" filter="url(#subtleGlow)">🌸 ✦ 🌸</text>
    <text class="text-title" filter="url(#glow)" y="10">ARTEM SKLYARUK</text>
    <text class="text-sub" y="45">
      <tspan fill="#cba6f7">🦀 Rust</tspan> • <tspan fill="#89b4fa">⚡ Full-Stack Engineer</tspan> • <tspan fill="#f5c2e7">🤖 AI Architect</tspan>
    </text>
    <text class="text-sub" y="70" font-size="12" fill="#7f849c">
      「 🌙 眠らないコードを紡ぐ • Crafting Aesthetic Logic 」
    </text>
  </g>

  <!-- Right Corner Sitting Cat (Catppuccin Style) -->
  <g transform="translate(810, 180)">
    <!-- Perfectly Anchored Wagging Tail at (14, 38) -->
    <g transform="translate(14, 38)">
      <path d="M 0 0 C 12 -5, 18 -18, 12 -28" stroke="#f5c2e7" stroke-width="4.5" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 12 0 0; 0 0 0" dur="2.5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Cat Body -->
    <ellipse cx="0" cy="30" rx="18" ry="22" fill="#cba6f7" />

    <!-- Cat Head -->
    <circle cx="0" cy="5" r="14" fill="#cba6f7" />

    <!-- Ears -->
    <g>
      <polygon points="-12,-3 -4,-18 0,-5" fill="#f5c2e7" />
      <polygon points="12,-3 4,-18 0,-5" fill="#f5c2e7" />
      <polygon points="-10,-4 -5,-14 -1,-6" fill="#f38ba8" />
      <polygon points="10,-4 5,-14 1,-6" fill="#f38ba8" />
    </g>

    <!-- Eyes -->
    <ellipse cx="-5" cy="4" rx="2" ry="3" fill="#11111b" />
    <ellipse cx="5" cy="4" rx="2" ry="3" fill="#11111b" />
    <circle cx="-4" cy="3" r="0.7" fill="#ffffff" />
    <circle cx="6" cy="3" r="0.7" fill="#ffffff" />

    <!-- Nose / Mouth -->
    <polygon points="-1,8 1,8 0,9.5" fill="#f38ba8" />
    <path d="M -3 11 Q 0 13 3 11" stroke="#11111b" stroke-width="1.2" fill="none" />

    <!-- Whiskers -->
    <line x1="-12" y1="7" x2="-20" y2="5" stroke="#bac2de" stroke-width="1" />
    <line x1="-12" y1="10" x2="-19" y2="11" stroke="#bac2de" stroke-width="1" />
    <line x1="12" y1="7" x2="20" y2="5" stroke="#bac2de" stroke-width="1" />
    <line x1="12" y1="10" x2="19" y2="11" stroke="#bac2de" stroke-width="1" />

    <!-- Paws -->
    <ellipse cx="-7" cy="48" rx="5" ry="3" fill="#f5c2e7" />
    <ellipse cx="7" cy="48" rx="5" ry="3" fill="#f5c2e7" />
  </g>

  <!-- Left Corner Decorative Floating Cat Bubble -->
  <g transform="translate(55, 175)" class="float-sakura">
    <rect x="-35" y="-20" width="70" height="26" rx="13" fill="#313244" stroke="#f5c2e7" stroke-width="1" />
    <text x="0" y="-3" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5c2e7" text-anchor="middle">Nya! 🐾</text>
  </g>
</svg>
